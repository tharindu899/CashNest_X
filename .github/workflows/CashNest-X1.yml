                      if (mimeType == null || mimeType.trim().isEmpty() || "application/octet-stream".equals(mimeType)) {
                          String ext = MimeTypeMap.getFileExtensionFromUrl(fileName == null ? "" : fileName);
                          String guessed = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext == null ? "" : ext.toLowerCase());
                          if (guessed != null) mimeType = guessed;
