                  ret.put("received", savedReceived);
                  ret.put("total", savedTotal > 0 ? savedTotal : 0);
                  ret.put("percent", savedTotal > 0 ? Math.min(100, (savedReceived * 100.0) / savedTotal) : 0);
                  if (expectedSize > 0) ret.put("expectedSize", expectedSize);
