              @PluginMethod
              public void isAvailable(PluginCall call) {
                  int authenticators = BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.DEVICE_CREDENTIAL;
                  int result = BiometricManager.from(getContext()).canAuthenticate(authenticators);
                  JSObject ret = new JSObject();
                  ret.put("available", result == BiometricManager.BIOMETRIC_SUCCESS);
                  ret.put("code", result);
                  call.resolve(ret);
              }

              @PluginMethod
              public void verify(PluginCall call) {
                  String title = call.getString("title", "Unlock CashNest X");
                  String subtitle = call.getString("subtitle", "Use fingerprint or screen lock");

                  getActivity().runOnUiThread(() -> {
                      Executor executor = ContextCompat.getMainExecutor(getContext());
                      BiometricPrompt prompt = new BiometricPrompt((FragmentActivity) getActivity(), executor, new BiometricPrompt.AuthenticationCallback() {
                          @Override
                          public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult result) {
                              JSObject ret = new JSObject();
                              ret.put("verified", true);
                              call.resolve(ret);
                          }

                          @Override
                          public void onAuthenticationError(int errorCode, @NonNull CharSequence errString) {
                              call.reject(errString.toString());
                          }

                          @Override
                          public void onAuthenticationFailed() {
                              notifyListeners("biometricFailed", new JSObject());
                          }
                      });

                      BiometricPrompt.PromptInfo promptInfo = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle(title)
                          .setSubtitle(subtitle)
                          .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.DEVICE_CREDENTIAL)
                          .build();
                      prompt.authenticate(promptInfo);
                  });
              }
          }
