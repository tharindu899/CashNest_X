                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(uri, mimeType);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);

                      JSObject ret = new JSObject();
                      ret.put("opened", true);
                      ret.put("target", "file");
                      call.resolve(ret);
                  } catch (ActivityNotFoundException noApp) {
                      openDownloadsFolder(call);
                  } catch (Exception e) {
                      call.reject("Failed to open export file", e);
                  }
              }

              @PluginMethod
              public void openDownloadsFolder(PluginCall call) {
                  String directory = call.getString("directory", "Downloads");
                  boolean documents = directory != null && "Documents".equalsIgnoreCase(directory.trim());
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      String root = documents ? "documents" : "downloads";
                      intent.setDataAndType(Uri.parse("content://com.android.providers.downloads.documents/root/" + root), "vnd.android.document/root");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);

                      JSObject ret = new JSObject();
                      ret.put("opened", true);
                      ret.put("target", documents ? "documents" : "downloads");
                      call.resolve(ret);
                  } catch (Exception first) {
                      try {
                          Intent intent = new Intent(documents ? "android.intent.action.OPEN_DOCUMENT" : "android.intent.action.VIEW_DOWNLOADS");
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(intent);

                          JSObject ret = new JSObject();
                          ret.put("opened", true);
                          ret.put("target", documents ? "documents" : "downloads");
                          call.resolve(ret);
                      } catch (Exception second) {
                          call.reject(documents ? "Failed to open Documents folder" : "Failed to open Downloads folder", second);
                      }
                  }
              }

              private JSObject saveToPublicFolder(String directoryName, String folderName, String fileName, String mimeType, byte[] bytes, boolean replaceExisting) throws Exception {
                  String publicDir = normalizePublicDirectory(directoryName);
                  String safeFolder = (folderName == null || folderName.trim().isEmpty()) ? "CashNest X" : folderName.trim();
                  String relativePath = publicDir + "/" + safeFolder + "/";
                  String folderLabel = publicDir + "/" + safeFolder;
                  JSObject ret = new JSObject();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentResolver resolver = getContext().getContentResolver();
                      Uri collection = MediaStore.Files.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                      int deleted = replaceExisting ? deleteExistingPublicFiles(resolver, collection, relativePath, fileName) : 0;

                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, relativePath);
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                      Uri uri = resolver.insert(collection, values);
                      if (uri == null) throw new Exception("Could not create " + folderLabel + " file");

                      try (OutputStream out = resolver.openOutputStream(uri)) {
                          if (out == null) throw new Exception("Could not open " + folderLabel + " file");
                          out.write(bytes);
                          out.flush();
                      }

                      values.clear();
                      values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      resolver.update(uri, values, null, null);
                      ret.put("uri", uri.toString());
                      ret.put("path", folderLabel + "/" + fileName);
                      ret.put("folder", folderLabel);
                      ret.put("method", "Documents".equals(publicDir) ? "android-documents" : "android-downloads");
                      ret.put("replaced", deleted > 0);
                      return ret;
                  }

                  File dir = new File(Environment.getExternalStoragePublicDirectory(publicDir), safeFolder);
                  if (!dir.exists() && !dir.mkdirs()) throw new Exception("Could not create " + folderLabel);
                  File file = new File(dir, fileName);
                  boolean replaced = false;
                  if (replaceExisting && file.exists()) {
                      replaced = file.delete();
                  }
                  try (FileOutputStream out = new FileOutputStream(file, false)) {
                      out.write(bytes);
                      out.flush();
                  }
                  ret.put("path", file.getAbsolutePath());
                  ret.put("folder", folderLabel);
                  ret.put("method", "Documents".equals(publicDir) ? "android-documents" : "android-downloads");
                  ret.put("replaced", replaced);
                  return ret;
              }

              private JSObject readFromPublicFolder(String directoryName, String folderName, String fileName) throws Exception {
                  String publicDir = normalizePublicDirectory(directoryName);
                  String safeFolder = (folderName == null || folderName.trim().isEmpty()) ? "CashNest X" : folderName.trim();
                  String relativePath = publicDir + "/" + safeFolder + "/";
                  String folderLabel = publicDir + "/" + safeFolder;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentResolver resolver = getContext().getContentResolver();
                      Uri collection = MediaStore.Files.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                      String[] projection = new String[] { MediaStore.MediaColumns._ID, MediaStore.MediaColumns.SIZE };
                      String selection = MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?";
                      String[] args = new String[] { fileName, relativePath };
                      try (Cursor cursor = resolver.query(collection, projection, selection, args, MediaStore.MediaColumns.DATE_MODIFIED + " DESC")) {
                          if (cursor == null || !cursor.moveToFirst()) return null;
                          long id = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.MediaColumns._ID));
                          Uri uri = ContentUris.withAppendedId(collection, id);
                          byte[] bytes = readAllBytes(resolver.openInputStream(uri));
                          JSObject ret = new JSObject();
                          ret.put("found", true);
                          ret.put("method", "android-documents" );
                          ret.put("fileName", fileName);
                          ret.put("uri", uri.toString());
                          ret.put("path", folderLabel + "/" + fileName);
                          ret.put("folder", folderLabel);
                          ret.put("size", bytes.length);
                          ret.put("base64Data", Base64.encodeToString(bytes, Base64.NO_WRAP));
                          return ret;
                      }
                  }

                  File dir = new File(Environment.getExternalStoragePublicDirectory(publicDir), safeFolder);
                  File file = new File(dir, fileName);
                  if (!file.exists()) return null;
                  byte[] bytes = readAllBytes(new FileInputStream(file));
                  JSObject ret = new JSObject();
                  ret.put("found", true);
                  ret.put("method", "android-documents");
                  ret.put("fileName", fileName);
                  ret.put("path", file.getAbsolutePath());
                  ret.put("folder", folderLabel);
                  ret.put("size", bytes.length);
                  ret.put("base64Data", Base64.encodeToString(bytes, Base64.NO_WRAP));
                  return ret;
              }

              private int deleteExistingPublicFiles(ContentResolver resolver, Uri collection, String relativePath, String fileName) {
                  int deleted = 0;
                  String[] projection = new String[] { MediaStore.MediaColumns._ID };
                  String selection = MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?";
                  String[] args = new String[] { fileName, relativePath };
                  try (Cursor cursor = resolver.query(collection, projection, selection, args, null)) {
                      if (cursor == null) return 0;
                      while (cursor.moveToNext()) {
                          long id = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.MediaColumns._ID));
                          Uri uri = ContentUris.withAppendedId(collection, id);
                          deleted += resolver.delete(uri, null, null);
                      }
                  } catch (Exception ignored) {}
                  return deleted;
              }

              private byte[] readAllBytes(InputStream input) throws Exception {
                  if (input == null) throw new Exception("Could not open backup file");
                  try (InputStream in = input; ByteArrayOutputStream buffer = new ByteArrayOutputStream()) {
                      byte[] data = new byte[8192];
                      int read;
                      while ((read = in.read(data, 0, data.length)) != -1) {
                          buffer.write(data, 0, read);
                      }
                      return buffer.toByteArray();
                  }
              }

              private String normalizePublicDirectory(String directoryName) {
                  if (directoryName != null && "Documents".equalsIgnoreCase(directoryName.trim())) return Environment.DIRECTORY_DOCUMENTS;
                  return Environment.DIRECTORY_DOWNLOADS;
              }
          }
