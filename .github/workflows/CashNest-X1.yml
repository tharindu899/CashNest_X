              private static void downloadPrivateGitHubAsset(Context context, String url, File target, JSONObject headers, long expectedSize, long id) throws Exception {
                  File part = new File(target.getAbsolutePath() + ".part");
                  if (part.exists()) part.delete();
                  if (target.exists()) target.delete();

                  HttpURLConnection connection = openGitHubConnection(url, headers);
                  int code = connection.getResponseCode();
                  if (code < 200 || code >= 300) {
                      connection.disconnect();
                      throw new Exception("Download failed (" + code + "). Check token permission and network.");
                  }

                  long contentLength = connection.getContentLengthLong();
                  long total = Math.max(Math.max(contentLength, expectedSize), 0L);
                  prefs(context).edit().putLong(KEY_TOTAL, total).putString(KEY_STATUS, "downloading").apply();

                  byte[] buffer = new byte[64 * 1024];
                  long received = 0L;
                  long lastNotify = 0L;
                  BufferedInputStream input = new BufferedInputStream(connection.getInputStream());
                  FileOutputStream output = new FileOutputStream(part);
                  try {
                      int read;
                      while ((read = input.read(buffer)) != -1) {
                          output.write(buffer, 0, read);
                          received += read;
                          long now = System.currentTimeMillis();
                          if (now - lastNotify > 900 || received >= total) {
                              lastNotify = now;
                              prefs(context).edit()
                                  .putLong(KEY_RECEIVED, received)
                                  .putLong(KEY_TOTAL, Math.max(total, received))
                                  .putString(KEY_STATUS, "downloading")
                                  .apply();
                              showDownloading(context, received, Math.max(total, received));
                          }
                      }
                  } finally {
                      try { output.close(); } catch (Exception ignored) {}
                      try { input.close(); } catch (Exception ignored) {}
                      connection.disconnect();
                  }

                  if (!part.renameTo(target)) {
                      throw new Exception("Could not save downloaded APK.");
                  }

                  prefs(context).edit()
                      .putLong(KEY_RECEIVED, target.length())
                      .putLong(KEY_TOTAL, Math.max(Math.max(total, expectedSize), target.length()))
                      .putString(KEY_STATUS, "complete")
                      .apply();

                  if (!looksLikeApk(target, expectedSize)) {
                      prefs(context).edit().putString(KEY_STATUS, "error").apply();
                      showError(context, "Downloaded file is not the real APK. Check the private repo token and asset URL.");
                      return;
                  }
                  showComplete(context, target);
              }

              private static HttpURLConnection openGitHubConnection(String url, JSONObject headers) throws Exception {
                  URL current = new URL(url);
                  for (int redirect = 0; redirect < 8; redirect++) {
                      HttpURLConnection connection = (HttpURLConnection) current.openConnection();
                      connection.setInstanceFollowRedirects(false);
                      connection.setConnectTimeout(30000);
                      connection.setReadTimeout(30000);
                      connection.setRequestMethod("GET");
                      applyManualHeaders(connection, headers, "api.github.com".equalsIgnoreCase(current.getHost()));
                      int code = connection.getResponseCode();
                      if (code == HttpURLConnection.HTTP_MOVED_PERM
                          || code == HttpURLConnection.HTTP_MOVED_TEMP
                          || code == HttpURLConnection.HTTP_SEE_OTHER
                          || code == 307
                          || code == 308) {
                          String location = connection.getHeaderField("Location");
                          connection.disconnect();
                          if (location == null || location.trim().isEmpty()) throw new Exception("GitHub asset redirect missing download location.");
                          current = new URL(current, location);
                          continue;
                      }
                      return connection;
                  }
                  throw new Exception("Too many GitHub asset redirects.");
              }

              private static void applyManualHeaders(HttpURLConnection connection, JSONObject headers, boolean githubApiHost) {
                  connection.setRequestProperty("User-Agent", "CashNest-X-Android-Updater");
                  connection.setRequestProperty("Accept", githubApiHost ? "application/octet-stream" : "application/octet-stream");
                  if (githubApiHost) connection.setRequestProperty("X-GitHub-Api-Version", "2022-11-28");
                  if (headers == null) return;
                  Iterator<String> keys = headers.keys();
                  while (keys.hasNext()) {
                      String key = keys.next();
                      if (key == null) continue;
                      if (!githubApiHost && ("authorization".equalsIgnoreCase(key) || "x-github-api-version".equalsIgnoreCase(key))) continue;
                      String value = headers.optString(key, "");
                      if (value != null && !value.trim().isEmpty()) connection.setRequestProperty(key, value);
                  }
              }

