              }

              @PluginMethod
              public void saveLocalBackup(PluginCall call) {
                  String fileName = call.getString("fileName", "CashNest-X-auto-local-backup.cnbak");
                  String mimeType = call.getString("mimeType", "application/octet-stream");
                  String base64Data = call.getString("base64Data");
                  String directory = call.getString("directory", "Documents");
                  String folder = call.getString("folder", "CashNest X");
                  Boolean replaceExisting = call.getBoolean("replaceExisting", true);

                  if (base64Data == null || base64Data.trim().isEmpty()) {
                      call.reject("Missing backup data");
                      return;
                  }

                  try {
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      JSObject saved = saveToPublicFolder(directory, folder, fileName, mimeType, bytes, replaceExisting == null || replaceExisting.booleanValue());
                      saved.put("saved", true);
                      saved.put("method", "android-documents");
                      saved.put("fileName", fileName);
                      saved.put("size", bytes.length);
                      call.resolve(saved);
                  } catch (Exception e) {
                      call.reject("Failed to save local backup", e);
                  }
              }

              @PluginMethod
              public void readLocalBackup(PluginCall call) {
                  String fileName = call.getString("fileName", "CashNest-X-auto-local-backup.cnbak");
                  String directory = call.getString("directory", "Documents");
                  String folder = call.getString("folder", "CashNest X");

                  try {
                      JSObject publicBackup = readFromPublicFolder(directory, folder, fileName);
                      if (publicBackup != null) {
                          call.resolve(publicBackup);
                          return;
                      }

                      File dir = new File(getContext().getFilesDir(), "CashNestXBackups");
                      File file = new File(dir, fileName);
                      if (!file.exists()) {
                          call.reject("No automatic local backup found");
                          return;
                      }
                      byte[] bytes = readAllBytes(new FileInputStream(file));

                      JSObject ret = new JSObject();
                      ret.put("found", true);
                      ret.put("method", "android-app-storage-legacy");
                      ret.put("fileName", fileName);
                      ret.put("path", file.getAbsolutePath());
                      ret.put("folder", "App storage/CashNestXBackups");
                      ret.put("size", bytes.length);
                      ret.put("base64Data", Base64.encodeToString(bytes, Base64.NO_WRAP));
                      call.resolve(ret);
