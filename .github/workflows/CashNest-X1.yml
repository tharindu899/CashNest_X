name: CashNest X
run-name: CashNest X

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main          # every push to main → build + release
  workflow_dispatch:  # manual "Run workflow" button → build + release

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Preflight required GitHub Secrets ────────────────────────────────
      - name: Check required GitHub Secrets
        run: |
          missing=0
          for key in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "❌ Missing GitHub Secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Add missing secrets in: Repository Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ Required secrets are present"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      # ── 4. Install npm dependencies ──────────────────────────────────────────
      - name: Install npm dependencies
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_PROGRESS: "false"
        run: |
          set -euo pipefail
          echo "Node: $(node -v)"
          echo "npm:  $(npm -v)"
          npm config set registry https://registry.npmjs.org/

          # Stop immediately if package-lock still points to a private/internal registry.
          if grep -R "packages.applied-caas\|artifactory\|internal.api.openai" package-lock.json .npmrc 2>/dev/null; then
            echo "❌ Bad npm registry URL found in package-lock.json/.npmrc"
            exit 1
          fi

          npm install --no-audit --no-fund --prefer-online --registry=https://registry.npmjs.org/
          test -x node_modules/.bin/vite
          npx vite --version

      - name: Release safety check
        run: npm run release:check
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}

      # ── 5. Derive app version from workflow run number ───────────────────────
      # Correct mapping: run #11 → v0.1.1, run #139 → v1.3.9. No forced major version for early runs.
      # Android versionCode still uses github.run_number because it must only go up.
      - name: Derive app version
        id: versioning
        run: node scripts/derive-version.cjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      # ── 6. Write version into package.json ───────────────────────────────────
      # So VITE_APP_VERSION can match the release tag.
      - name: Write version into package.json
        run: |
          cat > /tmp/set-version.js << 'JSEOF'
          const fs  = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('✅ package.json version set to', pkg.version);
          JSEOF
          node /tmp/set-version.js


      # ── 7. Build web app (Vite) ───────────────────────────────────────────────
      - name: Build web app (Vite)
        run: npm run build
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: ${{ env.VERSION }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
          VITE_APP_NAME: CashNest X
          VITE_APP_PACKAGE_NAME: ${{ vars.VITE_APP_PACKAGE_NAME || 'com.cashnest_x.pub' }}
          VITE_PUBLIC_APK: ${{ vars.VITE_PUBLIC_APK || secrets.VITE_PUBLIC_APK || 'true' }}
          VITE_ENABLE_FIREBASE_AUTH: ${{ vars.VITE_ENABLE_FIREBASE_AUTH || secrets.VITE_ENABLE_FIREBASE_AUTH || vars.VITE_ENABLE_GOOGLE_BACKUP || secrets.VITE_ENABLE_GOOGLE_BACKUP || 'false' }}
          VITE_ENABLE_GOOGLE_BACKUP: ${{ vars.VITE_ENABLE_FIREBASE_AUTH || secrets.VITE_ENABLE_FIREBASE_AUTH || vars.VITE_ENABLE_GOOGLE_BACKUP || secrets.VITE_ENABLE_GOOGLE_BACKUP || 'false' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_WEB_CLIENT_ID: ${{ secrets.VITE_FIREBASE_WEB_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_FIREBASE_WEB_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_CLOUDFLARE_WORKER_URL: ${{ secrets.VITE_CLOUDFLARE_WORKER_URL }}
          VITE_CLOUDFLARE_BACKUP_KEY: ${{ secrets.VITE_CLOUDFLARE_BACKUP_KEY }}

      # ── 8. Java ───────────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 9. Android SDK ────────────────────────────────────────────────────────
      # Use the Android SDK already available on GitHub ubuntu runners.
      # Do NOT call android-actions/setup-android here: it can try to install/update
      # the Android Emulator package, and GitHub mirrors sometimes return a corrupt
      # emulator zip which fails the whole APK build before Gradle starts.
      - name: Set up Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          if [ -d "$SDK_ROOT/cmdline-tools/16.0/bin" ]; then
            echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi
          echo "✅ Android SDK root: $SDK_ROOT"
          find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort || true

      - name: Install required Android SDK components only
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0'

      # ── 10. Capacitor — generate Android project ──────────────────────────────
      - name: Apply optional fork package name
        shell: bash
        env:
          VITE_APP_PACKAGE_NAME: ${{ vars.VITE_APP_PACKAGE_NAME || '' }}
        run: |
          set -euo pipefail
          if [ -n "${VITE_APP_PACKAGE_NAME:-}" ]; then
            node - <<'NODE'
          const fs = require('fs');
          const appId = process.env.VITE_APP_PACKAGE_NAME.trim();
          if (!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(appId)) {
            throw new Error(`Invalid VITE_APP_PACKAGE_NAME: ${appId}`);
          }
          const cap = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          cap.appId = appId;
          cap.appName = 'CashNest X';
          fs.writeFileSync('capacitor.config.json', JSON.stringify(cap, null, 2) + '\n');
          console.log(`✅ Capacitor package set to ${appId}`);
          NODE
          else
            echo "✅ Using package from capacitor.config.json"
          fi

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android folder already exists — skip cap add"
          fi

      - name: Add native APK installer, biometric, receipt, export, and Google plugins
        env:
          VITE_PUBLIC_APK: ${{ vars.VITE_PUBLIC_APK || secrets.VITE_PUBLIC_APK || 'true' }}
          VITE_ENABLE_FIREBASE_AUTH: ${{ vars.VITE_ENABLE_FIREBASE_AUTH || secrets.VITE_ENABLE_FIREBASE_AUTH || vars.VITE_ENABLE_GOOGLE_BACKUP || secrets.VITE_ENABLE_GOOGLE_BACKUP || 'false' }}
          VITE_ENABLE_GOOGLE_BACKUP: ${{ vars.VITE_ENABLE_FIREBASE_AUTH || secrets.VITE_ENABLE_FIREBASE_AUTH || vars.VITE_ENABLE_GOOGLE_BACKUP || secrets.VITE_ENABLE_GOOGLE_BACKUP || 'false' }}
          VITE_FIREBASE_WEB_CLIENT_ID: ${{ secrets.VITE_FIREBASE_WEB_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_FIREBASE_WEB_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          JAVA_PACKAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')).appId || 'com.cashnest_x.pub')")
          JAVA_DIR="android/app/src/main/java/${JAVA_PACKAGE//./\/}"
          export JAVA_PACKAGE JAVA_DIR
          mkdir -p "$JAVA_DIR" android/app/src/main/res/xml
          PUBLIC_FLAG="${VITE_PUBLIC_APK:-true}"
          GOOGLE_FLAG="${VITE_ENABLE_FIREBASE_AUTH:-${VITE_ENABLE_GOOGLE_BACKUP:-false}}"
          GOOGLE_WEB_CLIENT_ID="${VITE_FIREBASE_WEB_CLIENT_ID:-${VITE_GOOGLE_CLIENT_ID:-}}"
          GOOGLE_BACKUP_NATIVE_ENABLED="false"
          if [ "$GOOGLE_FLAG" = "true" ] && [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            GOOGLE_BACKUP_NATIVE_ENABLED="true"
          fi
          export GOOGLE_BACKUP_NATIVE_ENABLED
          echo "✅ Java package: $JAVA_PACKAGE"
          echo "✅ Firebase Google native plugin enabled: $GOOGLE_BACKUP_NATIVE_ENABLED"

          cat > "$JAVA_DIR/MainActivity.java" <<'JAVAFILE'
          package __CASHNEST_PACKAGE__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkInstallerPlugin.class);
                  registerPlugin(NativeBiometricAuthPlugin.class);
                  registerPlugin(NativeExportPlugin.class);
                  registerPlugin(CashNestGoogleAuthPlugin.class);
                  registerPlugin(CashNestReceiptScannerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAFILE

          if [ "$GOOGLE_BACKUP_NATIVE_ENABLED" = "true" ]; then
            cat > "$JAVA_DIR/CashNestGoogleAuthPlugin.java" <<'JAVAFILE'
          package __CASHNEST_PACKAGE__;

          import android.app.Activity;
          import android.content.Intent;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.auth.api.signin.GoogleSignInClient;
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions;
          import com.google.android.gms.common.api.ApiException;

          @CapacitorPlugin(name = "CashNestGoogle")
          public class CashNestGoogleAuthPlugin extends Plugin {
              private GoogleSignInClient signInClient;

              @PluginMethod
              public void signIn(PluginCall call) {
                  String serverClientId = call.getString("serverClientId", "");
                  if (serverClientId == null || serverClientId.trim().isEmpty()) {
                      call.reject("Missing Firebase Web client ID. Add VITE_FIREBASE_WEB_CLIENT_ID to GitHub Secrets.");
                      return;
                  }
                  GoogleSignInOptions options = new GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                      .requestEmail()
                      .requestProfile()
                      .requestIdToken(serverClientId)
                      .build();
                  signInClient = GoogleSignIn.getClient(getActivity(), options);
                  startActivityForResult(call, signInClient.getSignInIntent(), "handleSignInResult");
              }

              @ActivityCallback
              private void handleSignInResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result == null || result.getResultCode() != Activity.RESULT_OK) {
                      call.reject("Google sign-in cancelled.");
                      return;
                  }
                  Intent data = result.getData();
                  try {
                      GoogleSignInAccount account = GoogleSignIn.getSignedInAccountFromIntent(data).getResult(ApiException.class);
                      if (account == null) {
                          call.reject("Google account is missing. Check Android OAuth package name and release SHA-1.");
                          return;
                      }
                      String idToken = account.getIdToken();
                      if (idToken == null || idToken.trim().isEmpty()) {
                          call.reject("Google ID token missing. Add Android OAuth client with this package name and release SHA-1, then rebuild APK.");
                          return;
                      }

                      JSObject auth = new JSObject();
                      auth.put("idToken", idToken);

                      JSObject profile = new JSObject();
                      profile.put("name", account.getDisplayName() == null ? "Google User" : account.getDisplayName());
                      profile.put("email", account.getEmail() == null ? "" : account.getEmail());
                      profile.put("imageUrl", account.getPhotoUrl() == null ? "" : account.getPhotoUrl().toString());
                      profile.put("id", account.getId() == null ? "" : account.getId());

                      JSObject ret = new JSObject();
                      ret.put("authentication", auth);
                      ret.put("profile", profile);
                      ret.put("idToken", idToken);
                      ret.put("email", account.getEmail() == null ? "" : account.getEmail());
                      call.resolve(ret);
                  } catch (Exception error) {
                      call.reject("Google sign-in failed: " + error.getMessage(), error);
                  }
              }

              @PluginMethod
              public void getAccessToken(PluginCall call) {
                  call.reject("Firebase ID token refresh happens in the JavaScript Firebase service. Sign in again if the session expired.");
              }

              @PluginMethod
              public void clearToken(PluginCall call) {
                  call.resolve();
              }

              @PluginMethod
              public void signOut(PluginCall call) {
                  GoogleSignInClient client = signInClient;
                  if (client == null) {
                      client = GoogleSignIn.getClient(getActivity(), new GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN).build());
                  }
                  client.signOut()
                      .addOnSuccessListener(unused -> call.resolve())
                      .addOnFailureListener(error -> call.reject("Google sign-out failed: " + error.getMessage(), error));
              }
          }
          JAVAFILE
          else
            cat > "$JAVA_DIR/CashNestGoogleAuthPlugin.java" <<'JAVAFILE'
          package __CASHNEST_PACKAGE__;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "CashNestGoogle")
          public class CashNestGoogleAuthPlugin extends Plugin {
              private static final String MESSAGE = "Firebase Google login is not configured. Ask the developer to add Firebase Auth secrets and rebuild the APK.";

              @PluginMethod
              public void signIn(PluginCall call) {
                  call.reject(MESSAGE);
              }

              @PluginMethod
              public void getAccessToken(PluginCall call) {
                  call.reject(MESSAGE);
              }

              @PluginMethod
              public void clearToken(PluginCall call) {
                  call.resolve();
              }

              @PluginMethod
              public void signOut(PluginCall call) {
                  call.resolve();
              }
          }
          JAVAFILE
          fi

          cat > "$JAVA_DIR/CashNestReceiptScannerPlugin.java" <<'JAVAFILE'
          package __CASHNEST_PACKAGE__;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import java.io.InputStream;

          @CapacitorPlugin(name = "CashNestReceiptScanner")
          public class CashNestReceiptScannerPlugin extends Plugin {
              @PluginMethod
              public void scanReceipt(PluginCall call) {
                  String imageDataUrl = call.getString("imageDataUrl", "");
                  String path = call.getString("path", "");
                  try {
                      InputImage image = buildInputImage(imageDataUrl, path);
                      TextRecognizer recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      recognizer.process(image)
                              .addOnSuccessListener(result -> resolveText(call, result))
                              .addOnFailureListener(error -> call.reject("Google ML Kit could not read this receipt photo: " + error.getMessage(), error));
                  } catch (Exception error) {
                      call.reject("Receipt photo could not be opened for ML Kit: " + error.getMessage(), error);
                  }
              }

              private InputImage buildInputImage(String imageDataUrl, String path) throws Exception {
                  if (imageDataUrl != null && imageDataUrl.trim().startsWith("data:image")) {
                      String base64 = imageDataUrl.substring(imageDataUrl.indexOf(',') + 1);
                      byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                      Bitmap bitmap = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      if (bitmap == null) throw new Exception("Invalid receipt image data");
                      return InputImage.fromBitmap(bitmap, 0);
                  }

                  if (path != null && !path.trim().isEmpty()) {
                      Uri uri = Uri.parse(path);
                      if (uri.getScheme() == null) uri = Uri.fromFile(new java.io.File(path));
                      return InputImage.fromFilePath(getContext(), uri);
                  }

                  throw new Exception("Missing receipt image");
              }

              private void resolveText(PluginCall call, Text result) {
                  JSObject ret = new JSObject();
                  JSArray blocks = new JSArray();
                  for (Text.TextBlock block : result.getTextBlocks()) {
                      JSObject blockObj = new JSObject();
                      blockObj.put("text", block.getText());
                      if (block.getBoundingBox() != null) {
                          JSObject box = new JSObject();
                          box.put("left", block.getBoundingBox().left);
                          box.put("top", block.getBoundingBox().top);
                          box.put("right", block.getBoundingBox().right);
                          box.put("bottom", block.getBoundingBox().bottom);
                          blockObj.put("box", box);
                      }
                      blocks.put(blockObj);
                  }
                  ret.put("text", result.getText());
                  ret.put("blocks", blocks);
                  call.resolve(ret);
              }
          }
          JAVAFILE



          cat > "$JAVA_DIR/ApkInstallerPlugin.java" <<'JAVAFILE'
          package __CASHNEST_PACKAGE__;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {
              @PluginMethod
              public void installFromUrl(PluginCall call) {
                  String url = call.getString("apiUrl", call.getString("url"));
                  String fileName = call.getString("fileName", "CashNest-X-update.apk");
                  String version = call.getString("version", "");
                  JSONObject headers = call.getData().optJSONObject("headers");
                  if (headers == null) headers = new JSONObject();
                  long expectedSize = 0L;
                  try {
                      Object rawSize = call.getData().opt("size");
                      if (rawSize instanceof Number) expectedSize = ((Number) rawSize).longValue();
                  } catch (Exception ignored) {}

                  if (url == null || url.trim().isEmpty()) {
                      call.reject("Missing APK URL");
                      return;
                  }

                  try {
                      long id = CashNestApkUpdateHelper.enqueueDownload(getContext(), url, fileName, headers, true, expectedSize, version);
                      JSObject ret = new JSObject();
                      ret.put("queued", true);
                      ret.put("downloadId", id);
                      ret.put("message", "Download started. It will continue while the screen is off.");
                      call.resolve(ret);
                  } catch (Exception error) {
                      call.reject("Failed to start APK download", error);
                  }
              }

              @PluginMethod
              public void showUpdateNotification(PluginCall call) {
                  String url = call.getString("apiUrl", call.getString("url"));
                  String fileName = call.getString("fileName", "CashNest-X-update.apk");
                  String version = call.getString("version", "");
                  JSONObject headers = call.getData().optJSONObject("headers");
                  if (headers == null) headers = new JSONObject();
                  long size = 0;
                  try {
                      Object rawSize = call.getData().opt("size");
                      if (rawSize instanceof Number) size = ((Number) rawSize).longValue();
                  } catch (Exception ignored) {}
                  if (url == null || url.trim().isEmpty()) {
                      call.reject("Missing APK URL");
                      return;
                  }
                  CashNestApkUpdateHelper.showAvailable(getContext(), url, fileName, version, size, headers);
                  JSObject ret = new JSObject();
                  ret.put("shown", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void getDownloadState(PluginCall call) {
                  call.resolve(CashNestApkUpdateHelper.getDownloadState(getContext()));
              }

              @PluginMethod
              public void openDownloadedInstaller(PluginCall call) {
                  try {
                      CashNestApkUpdateHelper.openSavedInstaller(getContext());
                      JSObject ret = new JSObject();
                      ret.put("opened", true);
                      call.resolve(ret);
                  } catch (Exception error) {
                      call.reject("Failed to open downloaded APK installer", error);
                  }
              }

              @PluginMethod
              public void cleanupInstalledDownload(PluginCall call) {
                  String currentVersion = call.getString("currentVersion", "");
                  CashNestApkUpdateHelper.cleanupInstalledDownload(getContext(), currentVersion);
                  JSObject ret = new JSObject();
                  ret.put("cleaned", true);
                  call.resolve(ret);
              }
          }
          JAVAFILE

          cat > "$JAVA_DIR/CashNestUpdateActionReceiver.java" <<'JAVAFILE'
          package __CASHNEST_PACKAGE__;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.app.DownloadManager;
          import org.json.JSONObject;

          public class CashNestUpdateActionReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (DownloadManager.ACTION_DOWNLOAD_COMPLETE.equals(action)) {
                      long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                      CashNestApkUpdateHelper.handleDownloadComplete(context, id);
                      return;
                  }
                  if (CashNestApkUpdateHelper.ACTION_LATER.equals(action)) {
                      NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel(CashNestApkUpdateHelper.NOTIFICATION_ID);
                      return;
                  }
                  if (CashNestApkUpdateHelper.ACTION_OPEN_UPDATER.equals(action)) {
                      CashNestApkUpdateHelper.openUpdater(context);
                      return;
                  }
                  if (CashNestApkUpdateHelper.ACTION_DOWNLOAD.equals(action)) {
                      String url = intent.getStringExtra("url");
                      String fileName = intent.getStringExtra("fileName");
                      String headersJson = intent.getStringExtra("headersJson");
                      long expectedSize = intent.getLongExtra("expectedSize", 0L);
                      String version = intent.getStringExtra("version");
                      JSONObject headers = new JSONObject();
                      try { if (headersJson != null && !headersJson.trim().isEmpty()) headers = new JSONObject(headersJson); } catch (Exception ignored) {}
                      if (url != null && !url.trim().isEmpty()) {
