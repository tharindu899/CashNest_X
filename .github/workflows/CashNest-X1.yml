              public static void cleanupInstalledDownload(Context context, String currentVersion) {
                  String savedVersion = prefs(context).getString(KEY_VERSION, "");
                  File apk = getSavedApk(context);
                  boolean installedOrOlder = !savedVersion.trim().isEmpty()
                      && !cleanVersion(currentVersion).trim().isEmpty()
                      && compareVersions(savedVersion, currentVersion) <= 0;
                  if (installedOrOlder) {
                      try { if (apk != null && apk.exists()) apk.delete(); } catch (Exception ignored) {}
                      prefs(context).edit().clear().apply();
                      NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel(NOTIFICATION_ID);
                  }
              }

              private static String cleanVersion(String value) {
                  if (value == null) return "";
                  String out = value.trim().replaceFirst("^[vV]", "");
                  int dash = out.indexOf('-');
                  if (dash >= 0) out = out.substring(0, dash);
                  return out;
              }

              private static int compareVersions(String left, String right) {
                  String[] a = cleanVersion(left).split("\\.");
                  String[] b = cleanVersion(right).split("\\.");
                  int len = Math.max(Math.max(a.length, b.length), 3);
                  for (int i = 0; i < len; i++) {
                      int av = i < a.length ? parseVersionPart(a[i]) : 0;
                      int bv = i < b.length ? parseVersionPart(b[i]) : 0;
                      if (av > bv) return 1;
                      if (av < bv) return -1;
                  }
                  return 0;
              }

              private static int parseVersionPart(String value) {
                  try { return Integer.parseInt(value.replaceAll("[^0-9].*$", "")); }
                  catch (Exception ignored) { return 0; }
              }

              private static boolean looksLikeApk(File apk, long expectedSize) {
                  try {
                      if (apk == null || !apk.exists() || apk.length() < 1024 * 1024) return false;
                      if (expectedSize > 1024 * 1024 && apk.length() < (long) (expectedSize * 0.90)) return false;
                      java.io.FileInputStream input = new java.io.FileInputStream(apk);
                      try {
                          int first = input.read();
                          int second = input.read();
                          return first == 'P' && second == 'K';
                      } finally {
                          input.close();
                      }
                  } catch (Exception ignored) {
                      return false;
                  }
              }

              private static void applyHeaders(DownloadManager.Request request, JSONObject headers, String currentUrl) {
                  boolean hasAccept = false;
                  boolean hasUserAgent = false;
                  if (headers != null) {
                      Iterator<String> scanKeys = headers.keys();
                      while (scanKeys.hasNext()) {
                          String scanKey = scanKeys.next();
                          if ("accept".equalsIgnoreCase(scanKey)) hasAccept = true;
                          if ("user-agent".equalsIgnoreCase(scanKey)) hasUserAgent = true;
                      }
                  }
                  if (!hasUserAgent) request.addRequestHeader("User-Agent", "CashNest-X-Android-Updater");
                  if (!hasAccept) request.addRequestHeader("Accept", "application/octet-stream");
                  request.addRequestHeader("X-GitHub-Api-Version", "2022-11-28");
                  if (headers == null) return;
                  Iterator<String> keys = headers.keys();
                  while (keys.hasNext()) {
                      String key = keys.next();
                      if (key == null) continue;
                      String value = headers.optString(key, "");
                      if (value != null && !value.trim().isEmpty()) request.addRequestHeader(key, value);
                  }
              }

              private static PendingIntent downloadIntent(Context context, String url, String fileName, JSONObject headers, long expectedSize, String version) {
                  Intent intent = new Intent(context, CashNestUpdateActionReceiver.class);
                  intent.setAction(ACTION_DOWNLOAD);
                  intent.putExtra("url", url);
                  intent.putExtra("fileName", fileName);
                  intent.putExtra("headersJson", headers == null ? "{}" : headers.toString());
                  intent.putExtra("expectedSize", expectedSize);
                  intent.putExtra("version", cleanVersion(version));
                  return PendingIntent.getBroadcast(context, 91046, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static PendingIntent laterIntent(Context context) {
                  Intent intent = new Intent(context, CashNestUpdateActionReceiver.class);
                  intent.setAction(ACTION_LATER);
                  return PendingIntent.getBroadcast(context, 91047, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static PendingIntent openUpdaterIntent(Context context) {
                  return PendingIntent.getActivity(context, 91049, buildOpenUpdaterIntent(context), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static Intent buildOpenUpdaterIntent(Context context) {
                  Intent intent = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                  if (intent == null) {
                      intent = new Intent(Intent.ACTION_VIEW, Uri.parse("cashnest_x://updates"));
                  } else {
                      intent.setAction(Intent.ACTION_VIEW);
                      intent.setData(Uri.parse("cashnest_x://updates"));
                  }
                  intent.putExtra("cashnest_xScreen", "updates");
                  intent.putExtra("cashnest_xOpenUpdater", true);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return intent;
              }

              private static PendingIntent installIntent(Context context, File apk) {
                  Intent intent = buildInstallIntent(context, apk);
                  return PendingIntent.getActivity(context, 91048, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static Intent buildInstallIntent(Context context, File apk) {
                  Uri uri = FileProvider.getUriForFile(context, context.getPackageName() + ".fileprovider", apk);
                  Intent intent = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                  intent.setDataAndType(uri, "application/vnd.android.package-archive");
                  intent.setClipData(ClipData.newRawUri("CashNest X update", uri));
                  intent.putExtra(Intent.EXTRA_NOT_UNKNOWN_SOURCE, true);
                  intent.putExtra(Intent.EXTRA_RETURN_RESULT, false);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  return intent;
              }

              public static void openSavedInstaller(Context context) {
                  File apk = getSavedApk(context);
                  long expectedSize = prefs(context).getLong(KEY_EXPECTED_SIZE, 0L);
                  if (looksLikeApk(apk, expectedSize)) openInstaller(context, apk);
                  else {
                      prefs(context).edit().putString(KEY_STATUS, "error").apply();
                      showError(context, "Downloaded APK is incomplete. Download the update again.");
                  }
              }

              public static void openInstaller(Context context, File apk) {
                  context.startActivity(buildInstallIntent(context, apk));
              }

              public static void openUpdater(Context context) {
                  context.startActivity(buildOpenUpdaterIntent(context));
              }

              private static File getSavedApk(Context context) {
                  String path = prefs(context).getString(KEY_PATH, "");
                  if (path != null && !path.trim().isEmpty()) return new File(path);
                  String name = prefs(context).getString(KEY_FILE, "CashNest-X-update.apk");
                  File dir = context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                  if (dir == null) dir = context.getCacheDir();
                  return new File(dir, name);
              }

              private static void deleteOldCashNestApks(File dir, String keepName) {
                  try {
                      if (dir == null || !dir.exists()) return;
                      File[] files = dir.listFiles();
                      if (files == null) return;
                      for (File file : files) {
                          String name = file.getName();
                          if (name == null) continue;
                          boolean cashNestApk = name.toLowerCase().endsWith(".apk") && name.toLowerCase().contains("cashnest_x");
                          boolean partial = name.toLowerCase().contains("cashnest_x") && name.toLowerCase().endsWith(".apk.part");
                          if ((cashNestApk || partial) && !name.equals(keepName)) {
                              try { file.delete(); } catch (Exception ignored) {}
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              private static String sanitizeFileName(String name) {
                  return name.replaceAll("[^A-Za-z0-9._-]", "_");
              }

              private static void ensureChannel(Context context) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "CashNest X update progress", NotificationManager.IMPORTANCE_HIGH);
                  channel.setDescription("Shows CashNest X APK update download, updater, install and later actions");
                  channel.setShowBadge(false);
                  nm.createNotificationChannel(channel);
              }

              private static Bitmap getLargeIcon(Context context) {
                  try {
                      return BitmapFactory.decodeResource(context.getResources(), R.drawable.ic_cashnest_x_notification_large);
                  } catch (Exception ignored) {
                      return null;
                  }
              }

              private static int getSmallIcon() {
                  return R.drawable.ic_stat_cashnest_x_notification;
              }
          }
