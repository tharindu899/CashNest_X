          from PIL import Image
          import os, numpy as np

          SRC = "public/icon-1024.png" if os.path.exists("public/icon-1024.png") else "public/icon-512.png"
          RES = "android/app/src/main/res"
          DARK_BG = (13, 15, 20, 255)

          SIZES = {
              "mipmap-mdpi":    (48,  108),
              "mipmap-hdpi":    (72,  162),
              "mipmap-xhdpi":   (96,  216),
              "mipmap-xxhdpi":  (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }

          # Keep the 512 icon canvas exactly as designed.
          # Do NOT auto-crop transparent rounded corners, because Android adaptive
          # icons will become over-zoomed on Xiaomi/HyperOS launchers.
          src = Image.open(SRC).convert("RGBA")

          def fit_on_square(img, size, scale=0.86):
              # Transparent corners prevent the black square/outline seen on launchers
              # that still use legacy PNG icons.
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              target = int(size * scale)
              fitted = img.resize((target, target), Image.LANCZOS)
              canvas.alpha_composite(fitted, ((size - target) // 2, (size - target) // 2))
              return canvas

          for folder, (launcher_px, fg_px) in SIZES.items():
              path = os.path.join(RES, folder)
              os.makedirs(path, exist_ok=True)

              # Legacy launcher icons need padding so the wallet is not cropped/zoomed.
              legacy = fit_on_square(src, launcher_px, 0.94)
              legacy.save(os.path.join(path, "ic_launcher.png"), "PNG")
              legacy.save(os.path.join(path, "ic_launcher_round.png"), "PNG")

              # Adaptive foreground canvas is larger than the visible icon.
              # Keep the artwork inside the safe zone for all launchers.
              fg = Image.new("RGBA", (fg_px, fg_px), (0, 0, 0, 0))
              target = int(fg_px * 0.68)
              fg_img = src.resize((target, target), Image.LANCZOS)
              offset = ((fg_px - target) // 2, (fg_px - target) // 2)
              fg.alpha_composite(fg_img, offset)
              fg.save(os.path.join(path, "ic_launcher_foreground.png"), "PNG")

          print("✅ Android icon sizes generated from high-quality PNG with adaptive safe-zone padding")
          PYEOF

          cat > android/app/src/main/res/drawable/ic_launcher_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#111827"/>
          </shape>
          XML
          sed -i 's|<color name="ic_launcher_background">.*</color>|<color name="ic_launcher_background">#111827</color>|' \
            android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_cashnest_x_notification.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M14,10h20c4.4,0 8,3.6 8,8v2H14c-4.4,0 -8,-2.2 -8,-5s3.6,-5 8,-5z"/>
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M8,19h29c4.4,0 8,3.6 8,8v9c0,4.4 -3.6,8 -8,8H12c-4.4,0 -8,-3.6 -8,-8V23c0,-2.2 1.8,-4 4,-4zM33,29h12v8H33c-2.2,0 -4,-1.8 -4,-4s1.8,-4 4,-4z"/>
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M17,29h3v-2h4v2h3v4h-3v2h3v4h-3v2h-4v-2h-3v-4h3v-2h-3z"/>
          </vector>
          XML
          mkdir -p android/app/src/main/res/drawable-anydpi-v24
          cp android/app/src/main/res/drawable/ic_stat_cashnest_x_notification.xml \
             android/app/src/main/res/drawable-anydpi-v24/ic_stat_cashnest_x_notification.xml
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/cashnest_x_notification_color.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="cashnest_x_notification_color">#F97316</color>
          </resources>
          XML
          mkdir -p android/app/src/main/res/drawable-nodpi
          python3 << 'PYEOF'
          from pathlib import Path
          from PIL import Image
          src_path = Path('public/icon-1024.png') if Path('public/icon-1024.png').exists() else Path('public/icon-512.png')
          img = Image.open(src_path).convert('RGBA')
          side = max(img.size)
          canvas = Image.new('RGBA', (side, side), (0, 0, 0, 0))
          canvas.alpha_composite(img, ((side - img.width) // 2, (side - img.height) // 2))
          icon = canvas.resize((256, 256), Image.LANCZOS)
          icon.save('android/app/src/main/res/drawable-nodpi/ic_cashnest_x_notification_large.png', 'PNG', optimize=True)
          PYEOF
          echo "✅ Adaptive icon background, clean small notification icon, and matching lock-screen app icon generated"

      # ── Patch build.gradle — Android versionCode from run, visible versionName from app version ──
      - name: Patch build.gradle version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          APP_VERSION: ${{ env.VERSION }}
        run: |
          cat > /tmp/patch-gradle.py << 'PEOF'
          import re, os
          path = "android/app/build.gradle"
          code = os.environ["RUN_NUMBER"]
          name = os.environ["APP_VERSION"]
          txt = open(path).read()
          txt = re.sub(r"versionCode \d+", "versionCode " + code, txt)
          txt = re.sub(r'versionName "[^"]*"', 'versionName "' + name + '"', txt)
          open(path, "w").write(txt)
          print("✅ Android versionCode=" + code + "  versionName=" + name)
          PEOF
          python3 /tmp/patch-gradle.py

      - name: Write Android SDK path (local.properties)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Regenerate Android icons after Capacitor sync
        run: python3 scripts/generate_android_icons.py

      # ── 12. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 13. Decode keystore ───────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          KEYSTORE_PATH="${{ github.workspace }}/android/app/cashnest_x-release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      # ── 14. Print SHA-1 fingerprint ───────────────────────────────────────────
      - name: Print release keystore SHA-1
        run: |
          SHA1=$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -noprompt 2>/dev/null | grep "SHA1:" | head -1 | awk '{print $2}')
          echo "### 🔑 Release Keystore SHA-1" >> $GITHUB_STEP_SUMMARY
          echo "Public APK package fingerprint:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$SHA1"  >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "📋 Package name: **$PACKAGE_NAME**" >> $GITHUB_STEP_SUMMARY

      # ── 15. Build signed release APK ──────────────────────────────────────────
      - name: Build release APK
        id: build_apk
        working-directory: android
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      # ── 16. Rename APK ────────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/${{ env.APK_NAME }}

      # ── 17. Upload APK as workflow artifact ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: android/app/build/outputs/apk/release/${{ env.APK_NAME }}
          retention-days: 30


      # ── 18. Generate current-release notes ─────────────────────────────────
      - name: Generate automatic release notes
        run: npm run release:notes
        env:
          VERSION: ${{ env.VERSION }}
          TAG: ${{ env.TAG }}
          APK_NAME: ${{ env.APK_NAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      # ── 18. Create or update GitHub Release ───────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "CashNest X ${{ env.TAG }}"
          body_path: RELEASE_NOTES.md
          files: android/app/build/outputs/apk/release/${{ env.APK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true

      # ── 19. Job Summary — SUCCESS ─────────────────────────────────────────────
      - name: Write success summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Build Succeeded
          | Field | Value |
          |-------|-------|
          | **Version** | \`${{ env.TAG }}\` |
          | **Run** | \`#${{ github.run_number }}\` |
          | **APK** | \`${{ env.APK_NAME }}\` |
          | **Package** | \`$(node -e "console.log(JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')).appId)")\` |
          | **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Triggered by** | \`${{ github.event_name }}\` |
          EOF

      # ── 20. Job Summary — FAILURE ─────────────────────────────────────────────
      - name: Write failure summary
        if: failure()
        run: |
          GRADLE_LOG=""
          if [ -f /tmp/gradle-build.log ]; then
            GRADLE_LOG=$(tail -100 /tmp/gradle-build.log)
          fi
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## ❌ Build Failed
          ### Last 100 lines of Gradle log
          \`\`\`
          ${GRADLE_LOG:-No Gradle log captured — check the step logs above.}
          \`\`\`
          ### Common fixes
          | Error | Fix |
          |-------|-----|
          | \`KEYSTORE_BASE64\` | Check GitHub Secrets are set correctly |
          | \`SDK location not found\` | The Android SDK path/component setup step may have failed |
          | \`Could not resolve com.android\` | Network issue — re-run the workflow |
          | \`STORE_PASSWORD / KEY_PASSWORD\` | Check keystore passwords and alias |
          SUMMARY
